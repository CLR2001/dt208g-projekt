<section class="main-content home-main">
  <h1>Kurser</h1>
  <div class="filter-search-container">
    <div>
      <label for="search">Sök:</label>
      <input type="text" id="search" [(ngModel)]="courseService.searchInput" autocomplete="off">
    </div>
    <div>
      <label for="subject">Ämne:</label>
      <select name="subject" id="subject" [(ngModel)]="courseService.selectedSubject">
        <option value="Alla">Alla</option>
        @for (subject of courseService.allSubjects(); track subject) {
          <option [value]="subject">{{ subject }}</option>
        }
      </select>
    </div>
  </div>
  <p class="total-courses">
    Listar {{ courseService.filteredAndSortedCourses().length }} av totalt {{ courseService.allCourses().length }}
  </p>
  <app-course-table [courses]="courseService.displayedCourses()"></app-course-table>
</section>
